# The main pipeline for pei

resources:
  pipelines:
    pei_etl:
      name: pei_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/pei_etl"

      libraries:
        - glob:
            include: ../src/pei_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
